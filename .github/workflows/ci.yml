name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shopify_toolkit
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopify_toolkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopify_toolkit
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3002
      BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3002/api/auth
      SHOPIFY_TOKEN_ENCRYPTION_KEY: ci-shopify-encryption-key-at-least-32-chars
      SKIP_ENV_VALIDATION: "false"
      MAIL_OUTBOX_DIR: apps/api/.data/mail
      MAIL_PROVIDER: console
      PLAYWRIGHT_REUSE_SERVER: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Database backup tests run pg_dump against the Postgres 17 service, and
      # pg_dump refuses a server newer than itself.
      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "POSTGRES_CLIENT_BIN_DIR=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Generate database client
        run: pnpm db:generate

      - name: Deploy database migrations
        run: pnpm db:migrate:deploy


      - name: Check formatting and lint
        run: pnpm check:ci

      - name: Check types
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

      - name: Check package boundaries
        run: pnpm boundaries

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run auth integration
        run: pnpm --filter @repo/auth test:integration

      - name: Run database tools integration
        run: pnpm --filter @repo/database-tools test:integration

      - name: Run browser identity journeys
        run: pnpm test:e2e
